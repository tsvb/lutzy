name: CI

# Build LUTzy on every push to main and every PR targeting it, so broken
# commits are caught automatically. Zero third-party actions beyond the
# official checkout — matches the project's zero-dependency ethos.
on:
  push:
    # `claude/**` so an agent branch is built on every push, before it has a PR.
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress run if newer commits are pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The runner sets the **SDK**; `Package.swift` sets the **deployment target**. The target is
    # macOS 26, so macOS 26 API (Liquid Glass, `ToolbarSpacer`, `CIRAWFilter` highlight recovery) is
    # used unguarded, and only macOS 27 API goes behind `#available(macOS 27, *)`. That needs the
    # macOS 27 SDK, which ships with Xcode 27 — GitHub offers it on the `xcode-27` label (arm64,
    # preview while Xcode 27 is in beta). The `macos-26` images carry Xcode 26.x and cannot compile a
    # macOS 27 symbol, guarded or not: an availability check gates a call at runtime, it cannot
    # conjure a symbol the SDK never declared. (The same mistake once cost a red build on `macos-14`.)
    #
    # Building on a *lower* SDK than the developer's is what silently diverges, so the image default
    # is deliberate — and "Show toolchain" prints the SDK it resolved, so any future drift is visible
    # in the log rather than inferred from a failure.
    name: swift build (macOS 27 SDK, deploys to macOS 26)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          echo "SDK: $(xcrun --sdk macosx --show-sdk-version) at $(xcrun --sdk macosx --show-sdk-path)"

      - name: Build (debug)
        run: swift build -v

      - name: Test
        run: swift test

      - name: Build (release)
        run: swift build -c release
